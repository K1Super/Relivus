name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # unit tests (surefire) + integration tests (failsafe + Testcontainers, 依赖 Docker) + JaCoCo
      - name: Verify with Maven
        run: mvn -B verify --no-transfer-progress

      # 校验本地启动脚本与 .env 模板（Windows 一键启动为 PowerShell 脚本，仅做存在性与关键配置项检查）
      - name: Check dev startup script
        working-directory: ..
        run: |
          [[ -f scripts/start-dev.ps1 ]] || { echo "start-dev.ps1 missing"; exit 1; }
          [[ -f .env.example ]] && grep -q 'RELIVUS_META_PASSWORD' .env.example

  frontend:
    name: Frontend (build + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 类型检查 + 生产构建（tsc --noEmit 门禁，SRS 验收标准要求 npm run build 成功）
      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test