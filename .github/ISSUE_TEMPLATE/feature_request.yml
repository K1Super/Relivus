name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请尽量描述清晰，以便评估与排期。
  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点
      description: 该需求解决什么问题？现状有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述期望的功能形态与交互方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现路径？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考链接、原型图或其他上下文